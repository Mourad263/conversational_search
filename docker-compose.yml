services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: conv_search_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: conv_search
      POSTGRES_PASSWORD: conv_search_dev
      POSTGRES_DB: conv_search
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conv_search -d conv_search"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
